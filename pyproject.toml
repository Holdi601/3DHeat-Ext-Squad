[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-squad-demo"
version = "0.1.0"
description = "Squad server demos (Unreal network replays) into 3DHeat heatmap tables"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyarrow>=15", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-squad-demo = "heat3d_ext_squad.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_squad", "heat3d_update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: checks against real Squad demos on this machine; skipped where they are absent"]
